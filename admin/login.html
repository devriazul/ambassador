<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BHE Uni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="shared.css">
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen relative overflow-hidden">

    <!-- Background Glows -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full opacity-20 pointer-events-none blur-3xl" style="background: radial-gradient(circle, #f97316, transparent 70%);"></div>

    <div class="admin-card w-full max-w-md relative z-10 bg-slate-900/80 backdrop-blur-xl">
        <div class="flex justify-center mb-8">
             <img src="../logo.png" alt="BHE Uni" class="h-12 w-auto object-contain brightness-0 invert opacity-90"
                 onerror="this.outerHTML='<span style=\'color:#fff;font-weight:900;font-size:1.5rem;\'><i class=\'fa-solid fa-graduation-cap text-orange-500 mr-2\'></i>BHE Uni Admin</span>'"/>
        </div>

        <h2 class="text-2xl font-black text-white text-center mb-2">Welcome Back</h2>
        <p class="text-slate-400 text-center text-sm mb-8">Sign in to manage the ambassador programme.</p>

        <form action="index.html" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="email" class="admin-input w-full pl-10" placeholder="admin@bheuni.uk" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1 flex justify-between">
                    <span>Password</span>
                    <a href="#" class="text-orange-400 hover:underline">Forgot?</a>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="password" class="admin-input w-full pl-10" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="admin-btn bg-orange-500 hover:bg-orange-400 text-white w-full py-3 text-base">Sign In</button>
        </form>
    </div>

</body>
</html>
