<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - BHE Uni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="shared.css">
</head>
<body class="bg-slate-900 text-slate-200 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-950/80 border-r border-white/10 p-6 flex-shrink-0 flex flex-col">
        <div class="flex items-center gap-3 mb-10">
            <img src="../logo.png" alt="BHE Uni" class="h-9 w-auto object-contain brightness-0 invert opacity-90"
                 onerror="this.parentElement.outerHTML='<span style=\'color:#fff;font-weight:800;font-size:1.2rem;letter-spacing:-0.5px\'><i class=\'fa-solid fa-graduation-cap text-orange-500 mr-2\'></i>BHE Uni</span>'"/>
        </div>
        <nav class="flex flex-col gap-2">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="ambassadors.html" class="nav-link"><i class="fa-solid fa-users"></i> Ambassadors</a>
            <a href="referrals.html" class="nav-link"><i class="fa-solid fa-user-plus"></i> Referrals</a>
            <a href="reviews.html" class="nav-link"><i class="fa-solid fa-star"></i> Reviews</a>
            <a href="payouts.html" class="nav-link"><i class="fa-solid fa-money-bill-transfer"></i> Payouts</a>
            <a href="settings.html" class="nav-link active"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
        <div class="mt-auto">
            <div class="flex items-center gap-3 p-3 rounded-xl bg-white/5">
                <img src="https://i.pravatar.cc/40?u=admin" alt="Admin" class="w-10 h-10 rounded-full">
                <div>
                    <p class="text-white font-bold text-sm">Admin User</p>
                    <a href="login.html" class="text-slate-400 text-xs hover:text-orange-400">Log Out</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-black text-white">Platform Settings</h1>
            <p class="text-slate-400">Configure reward amounts and programme rules.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Reward Config -->
            <div class="admin-card">
                <h3 class="font-bold text-white mb-6 border-b border-white/10 pb-2">Reward Amounts</h3>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Review Reward (£)</label>
                        <input type="number" class="admin-input w-full" value="10">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Lead Referral Reward (£)</label>
                        <input type="number" class="admin-input w-full" value="5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">UK Enrolment Reward (£)</label>
                        <input type="number" class="admin-input w-full" value="500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">International Enrolment Reward (£)</label>
                        <input type="number" class="admin-input w-full" value="750">
                    </div>
                    <button type="button" class="admin-btn bg-orange-500 hover:bg-orange-400 text-white mt-4">Save Changes</button>
                </form>
            </div>

            <!-- Tier Config -->
            <div class="admin-card">
                <h3 class="font-bold text-white mb-6 border-b border-white/10 pb-2">Ambassador Tier Thresholds</h3>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Bronze (Leads Required)</label>
                        <input type="number" class="admin-input w-full" value="10">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Silver (Leads Required)</label>
                        <input type="number" class="admin-input w-full" value="25">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Gold (Leads Required)</label>
                        <input type="number" class="admin-input w-full" value="50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Platinum (Leads Required)</label>
                        <input type="number" class="admin-input w-full" value="100">
                    </div>
                    <button type="button" class="admin-btn bg-orange-500 hover:bg-orange-400 text-white mt-4">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
