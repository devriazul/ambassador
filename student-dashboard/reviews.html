<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews - Ambassador Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="shared.css">
</head>
<body class="bg-slate-900 text-slate-200 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-950/80 border-r border-white/10 p-6 flex-shrink-0 flex flex-col">
        <div class="flex items-center gap-3 mb-10">
            <img src="../logo.png" alt="BHE Uni" class="h-9 w-auto object-contain brightness-0 invert opacity-90"
                 onerror="this.parentElement.outerHTML='<span style=\'color:#fff;font-weight:800;font-size:1.1rem;\'><i class=\'fa-solid fa-graduation-cap text-blue-500 mr-2\'></i>BHE Uni</span>'"/>
        </div>
        <nav class="flex flex-col gap-2">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="referrals.html" class="nav-link"><i class="fa-solid fa-user-plus"></i> Referrals</a>
            <a href="reviews.html" class="nav-link active"><i class="fa-solid fa-star"></i> Reviews</a>
            <a href="wallet.html" class="nav-link"><i class="fa-solid fa-wallet"></i> Wallet & Payouts</a>
            <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
        <div class="mt-auto">
            <div class="flex items-center gap-3 p-3 rounded-xl bg-white/5 border border-white/5">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">AM</div>
                <div>
                    <p class="text-white font-bold text-sm">Alex Morgan</p>
                    <a href="login.html" class="text-slate-400 text-xs hover:text-blue-400">Log Out</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-black text-white">Review Rewards</h1>
            <p class="text-slate-400">Submit your published reviews to claim your £10 rewards.</p>
        </header>

        <!-- Submit Form -->
        <div class="student-card mb-8">
            <h3 class="font-bold text-white mb-4">Submit Review Link</h3>
            <form class="flex flex-col sm:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Platform</label>
                    <select class="student-input w-full">
                        <option>Google</option>
                        <option>Trustpilot</option>
                        <option>Facebook</option>
                    </select>
                </div>
                <div class="flex-[2] w-full">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Public Link to Review</label>
                    <input type="url" class="student-input w-full" placeholder="https://...">
                </div>
                <div class="w-full sm:w-auto">
                    <button type="button" class="student-btn bg-blue-600 hover:bg-blue-500 text-white w-full py-2.5">Claim Reward</button>
                </div>
            </form>
        </div>

        <!-- Table -->
        <div class="student-card p-0">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-slate-400 uppercase bg-white/5 border-b border-white/10">
                    <tr>
                        <th scope="col" class="p-4">Platform</th>
                        <th scope="col" class="p-4">Date Submitted</th>
                        <th scope="col" class="p-4">Status</th>
                        <th scope="col" class="p-4">Reward</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="hover:bg-white/5">
                        <td class="p-4 font-bold text-white"><i class="fa-solid fa-star text-green-400 mr-2"></i> Trustpilot</td>
                        <td class="p-4 text-slate-400">May 10, 2024</td>
                        <td class="p-4"><span class="status-badge bg-emerald-500/20 text-emerald-400">Approved</span></td>
                        <td class="p-4 font-black text-emerald-400">+£10</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
